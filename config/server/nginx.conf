# =============================================================
# Nginx Configuration — Test Platform (High-Concurrency)
# =============================================================
#
# TUNING RATIONALE:
#   worker_connections = 1024: each student login opens 1-2 connections
#     (login POST + redirect). 200 logins = ~400 connections, well
#     within 1024. Increase to 2048 if serving static assets from Nginx.
#
#   worker_processes = auto: uses all CPU cores.
#
#   keepalive_timeout = 65: keeps upstream PHP-FPM connections alive
#     to avoid TCP handshake overhead on rapid page transitions
#     (login → dashboard → test page).
#
#   proxy buffering off for API: prevents Nginx from buffering
#     large JSON responses (test data, question banks).
#
#   OPcache: PHP must have opcache.enable=1 in php.ini or pool config.
# =============================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;  # Linux; use kqueue on BSD/macOS
}

http {
    # ─── Basic Settings ──────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;

    # ─── MIME Types ──────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ─────────────────────────────────────────────
    access_log /var/log/nginx/access.log combined buffer=16k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # ─── Gzip Compression ────────────────────────────────────
    # Compress CSS/JS/JSON to reduce bandwidth for login pages.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript
        application/xml image/svg+xml;

    # ─── Rate Limiting ───────────────────────────────────────
    # Protect login endpoint against credential-stuffing floods.
    # 10 req/s per IP for login (200 logins/60s = 3.3/s total,
    # so 10/s per IP is generous for legitimate bursts).
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/s;

    # General API rate limit (50 req/s per IP).
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # ─── Upstream: PHP-FPM ───────────────────────────────────
    upstream php-fpm {
        server unix:/run/php/php8.3-fpm.sock;
        # Or TCP: server 127.0.0.1:9000;
        keepalive 32;  # Reuse FPM connections
    }

    # ─── Server Block ────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name your-domain.com;

        # Redirect HTTP → HTTPS (uncomment when SSL is ready)
        # return 301 https://$host$request_uri;

        root /var/www/test-platform/src/php/public;
        index index.php index.html;

        # ─── Security Headers ────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ─── Login Endpoint (rate-limited) ───────────────────
        location = /login.php {
            limit_req zone=login_limit burst=5 nodelay;
            limit_req_status 429;

            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 10s;  # Login should be fast

            # Keep FPM connections alive
            fastcgi_keep_conn on;
        }

        # ─── Signup Endpoint (rate-limited) ──────────────────
        location = /signup.php {
            limit_req zone=login_limit burst=3 nodelay;
            limit_req_status 429;

            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 10s;
            fastcgi_keep_conn on;
        }

        # ─── API Endpoints ───────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 15s;
            fastcgi_keep_conn on;
        }

        # ─── Static Assets (CSS/JS/Images) ──────────────────
        # Serve directly from Nginx — no PHP overhead.
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ─── FPM Status (internal only) ─────────────────────
        location = /fpm-status {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location = /fpm-ping {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # ─── Default PHP Handler ─────────────────────────────
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 30s;
            fastcgi_keep_conn on;

            # Prevent pathinfo-based attacks
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
        }

        # ─── Block Hidden Files ──────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ─── Block Sensitive Files ───────────────────────────
        location ~* \.(env|log|ini|bak|sql)$ {
            deny all;
        }
    }

    # ─── HTTPS Server (uncomment when SSL cert is ready) ─────
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # ... (same location blocks as above)
    # }
}
