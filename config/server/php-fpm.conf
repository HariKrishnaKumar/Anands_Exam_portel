; =============================================================
; PHP-FPM Pool Configuration — Test Platform (High-Concurrency)
; =============================================================
;
; TUNING RATIONALE:
;   Target: 200+ simultaneous student logins in a 60-second window.
;   Each login = 1 PHP-FPM worker for ~100 ms (bcrypt + DB + session).
;   200 logins / 60 s = ~3.3 logins/s peak.
;   With bcrypt cost=10 (~100 ms/verify), we need 3-5 workers
;   per concurrent login, plus headroom for non-login traffic.
;
;   pm.max_children = 70: handles 70 concurrent PHP processes.
;     Each process uses ~40-80 MB RAM → 2.8-5.6 GB total.
;     Adjust based on server RAM (aim for 70% of available).
;
;   pm.start_servers = 20: pre-warmed workers avoid cold-start latency
;     during the first login burst.
;
;   pm.min/max_spare: keeps 10-30 idle workers ready for bursts.
;
;   request_terminate_timeout = 30s: kills stuck processes (exam timeouts
;     are handled at app level, not FPM level).
;
;   pm.process_idle_timeout = 10s: reclaims idle workers faster than
;     default (30s) to free memory between bursts.
;
;   slowlog: catches any request >2s for profiling.
; =============================================================

[www]
; ─── Pool Mode ──────────────────────────────────────────────
; 'dynamic' spawns workers on demand up to max_children.
; 'ondemand' kills idle workers (higher latency on burst start).
; 'static' keeps all max_children alive (wastes RAM at low traffic).
pm = dynamic

; ─── Worker Limits ──────────────────────────────────────────
pm.max_children = 70       ; Max concurrent PHP workers
pm.start_servers = 20      ; Workers spawned at FPM start
pm.min_spare_servers = 10  ; Min idle workers kept ready
pm.max_spare_servers = 30  ; Max idle workers before reaping
pm.max_requests = 500      ; Recycle workers after 500 requests (prevents memory leaks)

; ─── Timeouts ───────────────────────────────────────────────
; Kill workers stuck for >30s (exams use JS timers, not PHP).
request_terminate_timeout = 30s

; Reclaim idle workers after 10s (default 30s is too slow for burst patterns).
pm.process_idle_timeout = 10s

; ─── Status Page (for monitoring) ───────────────────────────
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; ─── Logging ────────────────────────────────────────────────
access.log = /var/log/php-fpm/www-access.log
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

slowlog = /var/log/php-fpm/www-slow.log
request_slowlog_timeout = 2s

; ─── Security ───────────────────────────────────────────────
; Pass environment variables (needed for DB credentials via env).
clear_env = no

; Restrict pool to web user (adjust for your deployment).
user = www-data
group = www-data

; ─── PHP Settings (override php.ini for this pool) ──────────
; Session handler — use Redis/Memcached in production for
; zero file-lock contention (see nginx.conf for notes).
php_value[session.save_handler] = files
php_value[session.save_path] = /var/lib/php/sessions

; Security headers
php_admin_value[expose_php] = off
php_admin_value[display_errors] = off
php_admin_value[log_errors] = on

; File uploads (exam attachments if any)
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M

; OPcache — critical for performance
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 256
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_value[opcache.revalidate_freq] = 2
php_admin_value[opcache.save_comments] = 1
