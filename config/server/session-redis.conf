; =============================================================
; Session Handler — Redis (Zero File-Lock Contention)
; =============================================================
;
; WHY REDIS FOR SESSIONS:
;   PHP's default file-based sessions use flock() — a mutex lock
;   on the .sess file. Under 200+ concurrent logins, this creates
;   a serialisation bottleneck where Request N blocks until
;   Request N-1 releases the lock.
;
;   Redis stores sessions in memory with atomic operations (no locks).
;   Multiple PHP-FPM workers can read/write sessions concurrently
;   without blocking each other.
;
; INSTALLATION:
;   1. Install Redis: apt install redis-server php-redis
;   2. Update php.ini or php-fpm pool config with these settings.
;   3. Update auth.php session.save_handler to 'redis'.
;
; PERFORMANCE:
;   - Redis latency: <1ms (local socket)
;   - File session latency: 1-5ms (with lock contention under load)
;   - Under 200 concurrent logins, Redis handles sessions in <10ms total
;     vs file sessions which can take 50-200ms due to lock queueing.
; =============================================================

; --- Option A: php.ini settings (global) ---
; session.save_handler = redis
; session.save_path = "tcp://127.0.0.1:6379?auth=your_password&database=0"

; --- Option B: php-fpm pool config (per-pool) ---
; php_value[session.save_handler] = redis
; php_value[session.save_path] = "tcp://127.0.0.1:6379?auth=your_password&database=0"

; --- Option C: Unix socket (lower latency, same server) ---
; php_value[session.save_handler] = redis
; php_value[session.save_path] = "unix:///var/run/redis/redis.sock?database=0"

; --- Session Lifetime (exam-appropriate) ---
; php_value[session.gc_maxlifetime] = 1800  ; 30 minutes (matches exam timeout)
; php_value[session.cookie_lifetime] = 0    ; Until browser closes
; php_value[session.cookie_httponly] = 1    ; No JS access (XSS protection)
; php_value[session.cookie_secure] = 1      ; HTTPS only (enable after SSL)
; php_value[session.cookie_samesite] = Lax  ; CSRF protection

; =============================================================
; REDIS SERVER CONFIG (redis.conf snippet)
; =============================================================
;
; # /etc/redis/redis.conf
;
; # Bind to localhost only (sessions should never be network-accessible)
; bind 127.0.0.1
; port 6379
;
; # Authentication (set a strong password)
; requirepass your_very_strong_redis_password
;
; # Memory limit (sessions are small — 50 MB is plenty)
; maxmemory 100mb
; maxmemory-policy allkeys-lru
;
; # Persistence — AOF for durability (survives Redis restart)
; appendonly yes
; appendfsync everysec
;
; # Security
; protected-mode yes
; rename-command FLUSHDB ""
; rename-command FLUSHALL ""
